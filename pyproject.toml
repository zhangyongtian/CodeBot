[project]
name = "codebot"
version = "0.1.0"
description = "A lightweight GPT-style code generation model with Pretrain → SFT → GRPO training pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CodeBot Contributors" }
]
keywords = ["gpt", "transformer", "code-generation", "pytorch", "sft", "rlhf", "grpo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "torch>=2.0.0",
    "tiktoken>=0.5.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[project.urls]
Homepage = "https://github.com/codebot/CodeBot"
Issues = "https://github.com/codebot/CodeBot/issues"
Documentation = "https://github.com/codebot/CodeBot#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
